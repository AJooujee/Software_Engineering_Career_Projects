server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header X-Request-ID $request_id always;
    # Merge server-level headers with location-specific headers.
    add_header_inherit merge;

    # Emit one correlation ID and avoid duplicating the backend response value.
    proxy_hide_header X-Request-ID;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 30s;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
    }

    # BACKEND_UPSTREAM is backend:8000 in Compose and the internal Container
    # App name in Azure. Nginx substitutes only this environment variable.
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
    }

    location = /health {
        proxy_pass http://${BACKEND_UPSTREAM};
    }

    location = /health/ready {
        proxy_pass http://${BACKEND_UPSTREAM};
    }

    location = /docs {
        proxy_pass http://${BACKEND_UPSTREAM};
    }

    location = /redoc {
        proxy_pass http://${BACKEND_UPSTREAM};
    }

    location = /openapi.json {
        proxy_pass http://${BACKEND_UPSTREAM};
    }

    # Return the React entry point for browser-managed routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
    }
}
