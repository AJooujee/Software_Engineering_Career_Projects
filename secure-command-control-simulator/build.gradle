// Apply plugins required for building and running the Java application.
plugins {
    id 'java'
    id 'application'
}

// Define the project group and initial version.
group = 'com.aj'
version = '1.0.0'

// Download dependencies from Maven Central.
repositories {
    mavenCentral()
}

// Declare production and testing dependencies.
dependencies {
    // Jackson handles JSON serialization and parsing.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    // Use the JUnit 5 BOM so all JUnit components use matching versions.
    testImplementation platform('org.junit:junit-bom:5.11.4')

    // JUnit Jupiter API and test engine.
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Gradle 9 requires the JUnit Platform launcher
    // to be present on the test runtime classpath.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Require Java 21 for compilation.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Define the Java class containing the main method.
application {
    mainClass = 'com.aj.commandcontrol.CommandControlApplication'
}

// Configure all tests to use JUnit 5.
test {
    // Run all tests using JUnit 5.
    useJUnitPlatform()

    // Show each test result in the terminal.
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}