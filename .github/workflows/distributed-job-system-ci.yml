name: Distributed Job System CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "distributed-job-processing-system/**"
      - ".github/workflows/distributed-job-system-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "distributed-job-processing-system/**"
      - ".github/workflows/distributed-job-system-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributed-job-system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Lint, test, and validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: distributed-job-processing-system

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: job_system_ci
          POSTGRES_USER: job_user_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_user_ci -d job_system_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JOB_ENVIRONMENT: production
      JOB_DATABASE_URL: postgresql+asyncpg://job_user_ci:ci-only-password@localhost:5432/job_system_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: distributed-job-processing-system/pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Verify Ruff formatting
        run: ruff format --check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Verify current migration head
        run: alembic current | grep --fixed-strings "(head)"

      - name: Verify model and migration consistency
        run: alembic check

      - name: Run automated tests
        run: pytest

  compose-integration:
    name: Production Compose smoke test
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: distributed-job-processing-system

    env:
      JOB_ENVIRONMENT: production
      COMPOSE_PROJECT_NAME: distributed-job-system-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: job_system_ci
      POSTGRES_USER: job_user_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: "15433"
      API_PORT: "18002"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker compose build --pull

      - name: Start production stack
        run: >-
          docker compose up
          --detach
          --wait
          --wait-timeout 180

      - name: Verify migration container completed
        run: |
          migration_container="$(docker compose ps --all --quiet migration)"
          test -n "$migration_container"

          migration_state="$(
            docker inspect \
              --format '{{.State.Status}}:{{.State.ExitCode}}' \
              "$migration_container"
          )"

          test "$migration_state" = "exited:0"

      - name: Verify hardened runtime configuration
        run: |
          api_container="$(docker compose ps --quiet api)"
          worker_container="$(docker compose ps --quiet worker)"

          test "$(docker compose exec -T api id -u)" = "10001"
          test "$(docker compose exec -T worker id -u)" = "10001"

          test "$(
            docker inspect \
              --format '{{.HostConfig.ReadonlyRootfs}}' \
              "$api_container"
          )" = "true"

          test "$(
            docker inspect \
              --format '{{.HostConfig.ReadonlyRootfs}}' \
              "$worker_container"
          )" = "true"

      - name: Run end-to-end smoke test
        run: >-
          python scripts/ci_smoke.py
          --api-url http://127.0.0.1:18002
          --worker-url http://127.0.0.1:9000

      - name: Show Compose diagnostics
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200

      - name: Stop production stack
        if: always()
        run: docker compose down --volumes --remove-orphans