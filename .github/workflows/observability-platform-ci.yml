name: Observability Platform CI

on:
  push:
    paths:
      - "observability-incident-detection-platform/**"
      - ".github/workflows/observability-platform-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "observability-incident-detection-platform/**"
      - ".github/workflows/observability-platform-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Test and Code Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: observability-incident-detection-platform

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: observability-incident-detection-platform/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q