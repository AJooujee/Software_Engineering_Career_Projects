name: Observability Platform CI

on:
  push:
    paths:
      - "observability-incident-detection-platform/**"
      - ".github/workflows/observability-platform-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "observability-incident-detection-platform/**"
      - ".github/workflows/observability-platform-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Test and Code Quality
    runs-on: ubuntu-latest

    env:
      OBSERVABILITY_DATABASE_URL: postgresql+asyncpg://observability:observability_test@localhost:5433/observability

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: observability
          POSTGRES_USER: observability
          POSTGRES_PASSWORD: observability_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U observability -d observability"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: observability-incident-detection-platform

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: observability-incident-detection-platform/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q