name: Sensor Platform CI

# Run CI when Project 3 or this workflow changes.
on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "sensor-data-logging-test-platform/**"
      - ".github/workflows/sensor-platform-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "sensor-data-logging-test-platform/**"
      - ".github/workflows/sensor-platform-ci.yml"

permissions:
  contents: read

# Cancel an older run when new code is pushed to the same branch.
concurrency:
  group: sensor-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test Python and build Docker image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sensor-data-logging-test-platform

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sensor-data-logging-test-platform/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run automated tests
        run: python -m pytest

      # Verify that the application can be packaged for deployment.
      - name: Build Docker image
        run: docker build --tag sensor-data-platform:ci .
