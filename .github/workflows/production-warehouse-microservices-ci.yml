name: Production Warehouse Microservices CI

on:
  push:
    branches:
      - main
    paths:
      - "production-warehouse-microservices/**"
      - ".github/workflows/production-warehouse-microservices-ci.yml"
  pull_request:
    paths:
      - "production-warehouse-microservices/**"
      - ".github/workflows/production-warehouse-microservices-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - inventory-service
          - warehouse-service
          - order-service
          - api-gateway

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
      ORDER_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
      LOG_LEVEL: INFO

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production-warehouse-microservices/services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: production-warehouse-microservices/services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source and tests
        working-directory: production-warehouse-microservices/services/${{ matrix.service }}
        run: python -m compileall app tests

      - name: Apply database migrations
        if: matrix.service != 'api-gateway'
        working-directory: production-warehouse-microservices/services/${{ matrix.service }}
        run: python -m alembic upgrade head

      - name: Run tests
        working-directory: production-warehouse-microservices/services/${{ matrix.service }}
        run: python -m pytest -v

  integration-test:
    name: Gateway end-to-end test
    needs: unit-tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: production-warehouse-microservices

    env:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password

      WAREHOUSE_POSTGRES_DB: warehouse_db
      WAREHOUSE_POSTGRES_USER: warehouse_user
      WAREHOUSE_POSTGRES_PASSWORD: warehouse_password

      ORDER_POSTGRES_DB: order_db
      ORDER_POSTGRES_USER: order_user
      ORDER_POSTGRES_PASSWORD: order_password

      LOG_LEVEL: INFO

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start platform
        run: |
          docker compose up \
            --detach \
            --build \
            --wait \
            --wait-timeout 180

      - name: Run end-to-end smoke test
        run: python scripts/e2e_smoke.py

      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Stop platform
        if: always()
        run: docker compose down --volumes --remove-orphans