services:
  postgres:
    image: postgres:17-alpine
    container_name: observability-postgres
    environment:
      POSTGRES_DB: observability
      POSTGRES_USER: observability
      POSTGRES_PASSWORD: observability_dev
    ports:
      - "5433:5432"
    volumes:
      - observability_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U observability -d observability
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  observability_postgres_data: