services:
  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: ./services/inventory-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inventory-db:5432/${POSTGRES_DB}
    ports:
      - "8001:8001"
    depends_on:
      inventory-db:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
      interval: 5s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ORDER_POSTGRES_DB}
      POSTGRES_USER: ${ORDER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${ORDER_POSTGRES_USER} -d ${ORDER_POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

  warehouse-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB}
      POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - warehouse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${WAREHOUSE_POSTGRES_USER} -d ${WAREHOUSE_POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

  warehouse-service:
    build:
      context: ./services/warehouse-service
    environment:
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://${WAREHOUSE_POSTGRES_USER}:${WAREHOUSE_POSTGRES_PASSWORD}@warehouse-db:5432/${WAREHOUSE_POSTGRES_DB}
    ports:
      - "8002:8002"
    depends_on:
      warehouse-db:
        condition: service_healthy

    # Apply pending migrations before accepting API requests.
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8002"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ./services/order-service
    environment:
      ORDER_DATABASE_URL: postgresql+psycopg://${ORDER_POSTGRES_USER}:${ORDER_POSTGRES_PASSWORD}@order-db:5432/${ORDER_POSTGRES_DB}
      ORDER_INVENTORY_SERVICE_URL: http://inventory-service:8001
      ORDER_WAREHOUSE_SERVICE_URL: http://warehouse-service:8002
      ORDER_SERVICE_REQUEST_TIMEOUT_SECONDS: 5
    ports:
      - "8003:8003"
    depends_on:
      order-db:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      warehouse-service:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8003"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  inventory_postgres_data:
  warehouse_postgres_data:
  order_postgres_data: